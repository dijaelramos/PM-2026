name: Canal do YouTube (vídeo do material do dia)

# Todo dia às 07:05 de Pernambuco (10:05 UTC) e quando pedido à mão. Gera o vídeo dos materiais do dia e, se as
# credenciais do YouTube estiverem cadastradas nos secrets, publica. Sem credenciais, o vídeo fica disponível para
# download na aba Actions (artefato), para você subir pelo YouTube Studio.
on:
  workflow_dispatch:
    inputs:
      data:
        description: 'Data do material (AAAA-MM-DD). Vazio = hoje'
        required: false
  schedule:
    - cron: '5 10 * * 1-5'

permissions:
  contents: read

concurrency:
  group: canal
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -r canal/requirements.txt
      - name: Restaurar a voz já gerada
        uses: actions/cache@v4
        with:
          path: canal/.cache
          key: canal-voz-${{ github.run_id }}
          restore-keys: canal-voz-
      - name: Gerar o vídeo
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: python canal/video.py ${{ inputs.data && format('--data {0}', inputs.data) || '' }}
      - name: Guardar o vídeo (download na aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ inputs.data || github.run_id }}
          path: canal/saida/
          retention-days: 7
          if-no-files-found: ignore
      - name: Publicar no YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python canal/publicar.py

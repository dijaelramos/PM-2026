<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PMPE Ouvir</title>
<meta name="description" content="Material do Dia e Base de Conhecimento da PMPE 2026 para ler e ouvir, mesmo sem internet.">
<meta name="theme-color" content="#14365c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PMPE Ouvir">
<script>
  /* Aplica o tema salvo antes de desenhar a página, para não piscar. */
  try { var t = JSON.parse(localStorage.getItem('tema')); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  try { var l = JSON.parse(localStorage.getItem('larguraTexto')); if (l === 'estreita' || l === 'media' || l === 'toda') document.documentElement.dataset.largura = l; } catch (e) {}
  try { var x = JSON.parse(localStorage.getItem('escalaTexto')); if (x >= 0.8 && x <= 2) document.documentElement.style.setProperty('--escala-texto', x); } catch (e) {}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topo">
  <button id="voltar" class="icone-btn" aria-label="Voltar" hidden>‹</button>
  <h1 id="titulo-topo">PMPE Ouvir</h1>
  <span id="rede" class="rede" title="Situação da conexão"></span>
  <button id="tamanho" class="icone-btn tema tamanho" aria-label="Tamanho do texto" title="Tamanho do texto" aria-expanded="false" aria-controls="painel-texto">Aa</button>
  <button id="tema" class="icone-btn tema" aria-label="Usar tema escuro" title="Usar tema escuro"></button>
  <div id="crono-barra" class="crono-barra" hidden>
    <a href="#/cronometro" class="cb-link" aria-label="Abrir o cronômetro da sessão"><span aria-hidden="true">⏱</span> <b id="cb-tempo">0:00</b> <span id="cb-bloco"></span></a>
    <button id="cb-play" aria-label="Pausar o cronômetro">⏸</button>
  </div>
</header>

<div id="painel-texto" class="painel-texto" role="group" aria-label="Texto" hidden>
  <div class="linha-painel" role="group" aria-label="Tamanho do texto">
    <button id="t-menos" aria-label="Diminuir o texto">A−</button>
    <span id="t-valor" aria-live="polite">100%</span>
    <button id="t-mais" aria-label="Aumentar o texto">A+</button>
  </div>
  <div class="linha-painel larguras" role="radiogroup" aria-label="Largura do texto">
    <button data-largura="estreita" role="radio">Estreita</button>
    <button data-largura="media" role="radio">Média</button>
    <button data-largura="toda" role="radio">Tela toda</button>
  </div>
</div>

<main id="tela" tabindex="-1"></main>

<div id="acoes-bloco" class="acoes-bloco" role="toolbar" aria-label="Ações do trecho" hidden>
  <button id="ab-ouvir">▶ Ouvir daqui</button>
  <button id="ab-destacar">🖍 Destacar</button>
  <button id="ab-anotar">📝 Anotar</button>
  <button id="ab-questoes" hidden>✍ Questões</button>
</div>

<div id="editor-nota" class="editor-nota" role="dialog" aria-modal="true" aria-labelledby="en-titulo" hidden>
  <div class="editor-caixa">
    <h2 id="en-titulo">Anotação</h2>
    <p id="en-trecho" class="en-trecho"></p>
    <textarea id="en-texto" rows="5" placeholder="Escreva sua anotação sobre este trecho…"></textarea>
    <div class="editor-botoes">
      <button id="en-apagar" class="btn-link">Apagar anotação</button>
      <span class="espaco"></span>
      <button id="en-cancelar" class="btn">Cancelar</button>
      <button id="en-salvar" class="btn primario">Salvar</button>
    </div>
  </div>
</div>
<button id="seguir" class="seguir" hidden>↓ Voltar para a leitura</button>

<section id="player" class="player" hidden aria-label="Reprodutor">
  <div class="player-info">
    <div class="player-textos">
      <strong id="p-titulo"></strong>
      <span id="p-capitulo"></span>
      <a id="p-convite" class="convite" href="#/" hidden></a>
      <span id="p-aseguir" class="aseguir" hidden><span id="p-aseguir-txt"></span> <button id="p-pular" class="btn-link">Pular ›</button></span>
    </div>
    <button id="p-expandir" class="icone-btn expandir" aria-label="Mostrar todos os controles">⌃</button>
    <button id="p-sono" class="sono" aria-label="Timer de sono: desligado" title="Timer de sono"></button>
    <button id="p-fechar" class="icone-btn" aria-label="Fechar reprodutor">×</button>
  </div>
  <div class="player-barra">
    <span id="p-tempo">0:00</span>
    <input id="p-progresso" type="range" min="0" max="1000" value="0" aria-label="Posição">
    <button id="p-total" class="p-total" aria-label="Tempo restante. Toque para ver a duração total">0:00</button>
  </div>
  <div class="player-controles">
    <button id="p-cap-ant" aria-label="Capítulo anterior">⏮</button>
    <button id="p-voltar" aria-label="Voltar 15 segundos">−15</button>
    <button id="p-play" class="play" aria-label="Tocar">▶</button>
    <button id="p-avancar" aria-label="Avançar 30 segundos">+30</button>
    <button id="p-cap-prox" aria-label="Próximo capítulo">⏭</button>
    <button id="p-vel" class="vel" aria-label="Velocidade">1×</button>
  </div>
</section>

<audio id="audio" preload="metadata"></audio>
<script src="app.js"></script>
</body>
</html>
